name: Feature request
description: Propose a focused Tattoo improvement
body:
  - type: textarea
    attributes:
      label: Problem
      description: What concrete developer or agent-safety problem should Tattoo solve?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behavior
  - type: textarea
    attributes:
      label: Alternatives and trust-boundary impact
