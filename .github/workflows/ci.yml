name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Packed package consumer import
        shell: bash
        run: |
          consumer="$RUNNER_TEMP/tattoo-consumer"
          mkdir -p "$consumer"
          (cd packages/core && pnpm pack --pack-destination "$consumer")
          (cd packages/config && pnpm pack --pack-destination "$consumer")
          (cd packages/cli && pnpm pack --pack-destination "$consumer")
          (cd packages/claude-code && pnpm pack --pack-destination "$consumer")
          cd "$consumer"
          npm init -y >/dev/null
          npm install --ignore-scripts ./*.tgz
          node --input-type=module -e "Promise.all([import('@tattoo-ai/core'), import('@tattoo-ai/config'), import('@tattoo-ai/cli'), import('@tattoo-ai/claude-code')]).then(([core, config, cli, adapter]) => { if (typeof core.evaluatePolicy !== 'function' || config.DEFAULT_POLICY_PATH !== '.tattoo/policy.json' || typeof cli.runCli !== 'function' || typeof adapter.evaluatePreToolUse !== 'function') process.exit(1) })"
      - name: Clean git status
        shell: bash
        run: |
          status="$(git status --porcelain)"
          printf '%s\n' "$status"
          test -z "$status"
