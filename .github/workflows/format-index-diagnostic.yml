name: Format index diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/format-index-diagnostic.yml

permissions:
  contents: write

jobs:
  format-index:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier packages/core/src/index.ts --write
      - run: pnpm exec prettier packages/core/src/index.ts --check
      - name: Commit exact formatter output
        run: |
          if git diff --quiet -- packages/core/src/index.ts; then
            echo "Formatter produced no diff"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/src/index.ts
          git commit -m "style: normalize core formatting"
          git push
