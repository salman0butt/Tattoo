name: Fix core lint autofixes

on:
  pull_request:
    paths:
      - .github/workflows/fix-lint-index.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint packages/core/src/index.ts --fix
      - name: Commit safe lint autofixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- packages/core/src/index.ts; then exit 0; fi
          git add packages/core/src/index.ts
          git commit -m "style: apply core lint autofixes"
          git push
